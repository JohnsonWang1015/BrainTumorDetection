[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "idh-glioma"
version = "0.1.0"
description = "Detect and segment IDH mutation status in brain gliomas"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "nibabel>=5.2",
  "scikit-image>=0.24",
  "scikit-learn>=1.5",
  "tqdm>=4.66",
  "pyyaml>=6.0",
  "matplotlib>=3.9",
  "opencv-python>=4.10",
  "torch>=2.4",
  "torchvision>=0.19",
  "ultralytics>=8.3.0",
]

[dependency-groups]
dev = [
  "basedpyright>=1.31.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
default-groups = ["dev"]
