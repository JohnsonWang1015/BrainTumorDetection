[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "idh-glioma"
version = "0.1.0"
description = "Detect and segment brain tumors from CT and MRI scans"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "nibabel>=5.2",
  "Pillow>=10.0",
  "scikit-image>=0.24",
  "scikit-learn>=1.5",
  "tqdm>=4.66",
  "pyyaml>=6.0",
  "matplotlib>=3.9",
  "opencv-python>=4.10",
  "torch>=2.4",
  "torchvision>=0.19",
  "ultralytics>=8.3.0",
]

[project.scripts]
prepare-mri = "idh_glioma.data.prepare_dataset:main"
prepare-ct  = "idh_glioma.data.prepare_ct_data:main"
train-seg   = "idh_glioma.train.train_segmentation:main"
train-idh   = "idh_glioma.train.train_idh_classifier:main"
train-ct    = "idh_glioma.train.train_ct_classifier:main"
eval-ct     = "idh_glioma.eval.eval_ct:main"
eval-seg    = "idh_glioma.eval.eval_seg:main"
infer       = "idh_glioma.infer.pipeline:main"
train-yolo  = "idh_glioma.train.train_yolo_detection:main"

[dependency-groups]
dev = [
  "basedpyright>=1.31.0",
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
default-groups = ["dev"]
